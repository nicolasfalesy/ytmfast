# Optional: keep the engine running from login instead of starting it on demand and
# quitting it when idle. Paused, it uses no CPU and about 8 MB of memory. Install with the
# "Keep it running" steps in README.md.
[Unit]
# PipeWire first, so the first play needs no reconnect (the engine copes either way).
After=pipewire.service

[Service]
ExecStart=
ExecStart=%h/.local/bin/ytmfast daemon --stay
# A crash brings it back; a clean stop (`quit`, systemctl stop) stays stopped until the
# socket's next connection.
Restart=on-failure
RestartSec=2
