[package]
name = "ytmfast"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A headless YouTube Music engine for bar widgets, with no browser"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "ytmfast"
path = "src/main.rs"

[dependencies]
# The audio thread's events (AudioPlayer): a channel any number of listeners can clone.
crossbeam-channel = "0.5"
# Chromium "v10" cookie decryption: AES-128-CBC with a PBKDF2-SHA1 key (same versions oo7 already pulls in).
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
pbkdf2 = { version = "0.12", features = ["hmac"] }
# SessionStore is used as Arc<dyn SessionStore>; plain async fn in a trait is not object safe (ruling R1).
async-trait = "0.1.92"
# getuid() for the /run/user/$UID fallback; libc is already in the tree through reqwest.
libc = "0.2"
# Lyrics: KuGou's KRC is zlib (`lyrics::krc`). miniz_oxide is pure Rust and has a decompress
# with an output limit, the inflate-bomb cap. Its default `with-alloc` only.
miniz_oxide = "0.8"
# Lyrics: `nameKey`'s `normalize("NFD")`. Already in the tree (and built with its compiled
# data) through url's idna, so no new crate comes in for it.
icu_normalizer = { version = "2.3", default-features = false, features = ["compiled_data"] }
# Lyrics: the widget's JavaScript regexes, ported pattern for pattern. regex-lite is already
# in the tree (symphonia), small, and its ASCII-only case folding and \b are JavaScript's
# (non-`u` regexes); JavaScript's wider \s is spelled out (`lyrics::js::SPACE_CLASS`).
regex-lite = "0.1"
# The session lives in the login keyring over the Secret Service D-Bus API. Default features = tokio +
# native_crypto (no async-std, no OpenSSL).
oo7 = "0.6"
# rustls only (no OpenSSL); http2 because the YouTube hosts speak it and it saves connections.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2"] }
# Audio output. v0_3_50: pw_stream_get_time_n, for the delay that the position subtracts.
pipewire = { version = "0.10", features = ["v0_3_50"] }
# The challenge solver: yt-dlp's ejs scripts run in an embedded QuickJS (quickjs-ng). Default
# features only: no loader, no std/os modules, so the scripts get no file, network or OS access.
rquickjs = "0.14"
# The lock-free ring between the audio thread and PipeWire's real-time callback.
rtrb = "0.4"
# Reads the Chromium Cookies database. bundled: no system libsqlite needed at build time. serialize: the
# database is opened from an in-memory copy, so the cookie values are never written to a temp file.
rusqlite = { version = "0.40.2", features = ["bundled", "serialize"] }
# The session is stored in the keyring as JSON.
serde = { version = "1.0.229", features = ["derive"] }
# preserve_order: the browse module lists rows in the order YouTube's JSON holds them (its walk is
# Page.js's `for (var k in o)`); the default sorted map would reorder a page's shelves and rows.
# No other dependency turns it on; `sections_follow_page_order_not_key_order` fails without it.
serde_json = { version = "1.0.151", features = ["preserve_order"] }
# SAPISIDHASH is a SHA-1; Chromium v24+ cookies start with a SHA-256 of the host.
sha1 = "0.10"
sha2 = "0.10"
# Demux only the two containers YouTube serves audio in (WebM, MP4), and decode AAC.
symphonia = { version = "0.6", default-features = false, features = ["mkv", "isomp4", "aac"] }
thiserror = "2"
# MPRIS, on zbus directly (already in the tree through oo7): the connection can be pointed at
# a private test bus by address, with no process-wide DBUS_SESSION_BUS_ADDRESS change.
zbus = { version = "5.19", default-features = false, features = ["tokio"] }
# sync: the async lock that keeps session saves in order (innertube), and the solver thread's
# reply channel. process + time: the yt-dlp fallback, killed after 30 s. net + io-util: the
# control socket. signal: a clean stop on SIGTERM/SIGINT.
tokio = { version = "1.53.2", features = ["rt", "macros", "sync", "process", "time", "net", "io-util", "signal"] }
url = "2.5"

[build-dependencies]
# Finds the system libopus (build.rs); already in the tree through aws-lc-sys.
pkg-config = "0.3"

[dev-dependencies]
# StreamExt for the MPRIS tests' signal streams (already in the tree through reqwest and zbus).
futures-util = { version = "0.3", default-features = false }
tempfile = "3"
# net + io-util: a raw TCP test server for the endless chunked answer that wiremock can't send.
# test-util: the paused clock for the download backoff test.
tokio = { version = "1.53.2", features = ["net", "io-util", "rt", "macros", "time", "test-util"] }
# A local HTTP server standing in for the InnerTube API.
wiremock = "0.6.5"

# Measured on this tree (release, cores 12-15, see the polish report): 22.56 MB -> 16.66 MB
# on disk, idle PSS 5.99 -> 4.79 MB, start-to-socket unchanged (about 1.5-1.9 ms).
[profile.release]
# Debug info only; the symbol table stays, so a core dump from systemd-coredump and a panic
# backtrace still name ytmfast's functions (the user diagnoses crashes from cores).
# `strip = true` would save 2.1 MB more on disk (14.57 MB) and nothing in memory or start.
strip = "debuginfo"
# Fat over thin: 1.06 MB smaller and 0.6 MB less idle PSS, for about a minute more per
# release build (clean 206 s against 147 s, a one-file rebuild 129 s against 69 s, on battery).
lto = "fat"
codegen-units = 1
# panic stays "unwind" (abort would save another 1.16 MB): the engine relies on catching
# panics. A panicking engine task is caught by tokio and ends the daemon cleanly as
# EngineGone (removing a self-bound socket); a panicking client task drops only that client;
# the audio and solver threads failing leave the rest running; and every Mutex recovers from
# poisoning. With abort, each of those would kill the whole process.
