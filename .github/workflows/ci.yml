name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # Arch, not the Ubuntu image: it matches the system ytmfast targets, and Ubuntu's
    # libpipewire is too old for the pipewire crate later steps use.
    container: archlinux:latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Install toolchain and libraries
        # git first, so actions/checkout makes a real clone instead of a tarball download.
        # clang: the pipewire crate's bindgen. opus: the system libopus the decoder links.
        # dbus: the MPRIS tests start a private dbus-daemon. No cmake or make: nothing in the
        # tree runs them since the bundled libopus went (a clean build with both blocked passes).
        run: pacman -Syu --noconfirm rust clang pkgconf pipewire opus sqlite ffmpeg git dbus

      - uses: actions/checkout@v7

      - name: Note the compiler version
        id: rustc
        # Arch's rust package moves often; keying the cache on its version stops a new
        # compiler from restoring a target folder it can't reuse.
        run: echo "version=$(rustc --version | tr ' ' '-')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ steps.rustc.outputs.version }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ steps.rustc.outputs.version }}-

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked
