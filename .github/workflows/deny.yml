name: Dependencies

# `cargo deny` checks Cargo.lock against the RustSec advisory database and deny.toml's licences,
# bans and crate sources (his pick, 2026-10-22); hooks/pre-push runs the same check. New advisories
# land on crates that did not change, so it also runs every Monday.
on:
  push:
  pull_request:
  schedule:
    # Mondays, 06:37 UTC (an off-the-hour minute: the top of the hour is busy).
    - cron: "37 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-deny:
    # Pinned (his pick, 2026-10-18): move to a newer Ubuntu on purpose, not by surprise.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # cargo deny reads the crate graph through cargo metadata, so it needs the pinned Rust.
      - name: Rust (the version in rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustc --version

      # The release binary checked against its SHA-256 (the laptop's version, and the same pin as
      # nic-bitwarden's CI), so nothing is built and the version only moves on purpose.
      - name: Install cargo-deny 0.20.2
        run: |
          set -eu
          dir=cargo-deny-0.20.2-x86_64-unknown-linux-musl
          curl -fsSL --proto =https -o "$RUNNER_TEMP/$dir.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/$dir.tar.gz"
          echo "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f  $RUNNER_TEMP/$dir.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$dir.tar.gz" -C "$RUNNER_TEMP" "$dir/cargo-deny"
          echo "$RUNNER_TEMP/$dir" >> "$GITHUB_PATH"

      - name: cargo deny
        run: cargo deny --workspace --locked check
